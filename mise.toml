[tools]
node = "24.22.2"
betterleaks = "1.10.1"
# opencode (sst/opencode v2, npm backend — explicit to avoid clash with aqua:anomalyco/opencode v1)
"npm:@opencode/cli" = "2.2.6"
# openspec (spec-driven development CLI)
"npm:@fission-ai/openspec" = "1.16.1"
"npm:firecrawl-cli" = "1.29.0"

# ── Git hooks ───────────────────────────────────────────────────────────────
# Versioned hooks live in .githooks/ (betterleaks pre-commit). Run once per clone:
#   mise run setup
[tasks.setup]
description = "Install tools and enable versioned git hooks (.githooks/)"
run = "mise install && git config core.hooksPath .githooks && echo 'hooks: core.hooksPath -> .githooks'"

# ── Dev environment ─────────────────────────────────────────────────────────
# Runs the API in dev mode (tsx watch) with env from .env.dev (gitignored).
[tasks.dev]
description = "Run the API backend and the Vite UI dev server (HMR, /api proxied)"
run = """
if [ -f .env.dev ]; then set -a; . ./.env.dev; set +a; fi
npm run dev & BACKEND_PID=$!
trap 'kill $BACKEND_PID 2>/dev/null' EXIT INT TERM
npm run dev:web
"""

# ── Preprod environment ─────────────────────────────────────────────────────
# Isolated app instance for testing (host port 5174, container port 5173 to
# match the Caddy target, own container + data volume). Production is never
# touched. NOTE: host port is 5174 (not 5173) so `mise run dev` (vite HMR
# on 5173) and preprod bind together. See hermes.yaml for the canonical map.
[tasks.preprod-up]
description = "Start the preprod app instance (http://localhost:5174)"
run = "${DOCKER_SUDO-sudo} docker compose --env-file .env.preprod -p places-preprod -f compose.yaml -f compose.preprod.yaml up -d --build"

[tasks.preprod-deploy]
description = "Deploy a branch to the single preprod preview slot (refuses to evict without --evict)"
usage = """
  flag "--branch <branch>" help="Branch to deploy (must match current checkout)"
  flag "--fresh-db" help="Reseed the demo DB after deploy"
  flag "--evict" help="Confirm evicting another branch's preview"
"""
run = """
ARGS="--branch ${usage_branch:?--branch is required}"
[ "${usage_fresh_db:-}" = "true" ] && ARGS="$ARGS --fresh-db"
[ "${usage_evict:-}" = "true" ] && ARGS="$ARGS --evict"
./scripts/preprod-deploy.sh $ARGS
"""

[tasks.preprod-verify]
description = "Verify preprod green (read-only: health, OIDC, logs, version, fixture)"
run = "./scripts/preprod-verify.sh"

[tasks.preprod-down]
description = "Stop the preprod app instance (keeps its data volume)"
run = "${DOCKER_SUDO-sudo} docker compose --env-file .env.preprod -p places-preprod -f compose.yaml -f compose.preprod.yaml down"

[tasks.preprod-logs]
description = "Follow preprod app logs"
run = "${DOCKER_SUDO-sudo} docker compose --env-file .env.preprod -p places-preprod -f compose.yaml -f compose.preprod.yaml logs -f places"

