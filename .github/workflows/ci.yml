# CI: fast merge gate for every PR to main + push to main.
# SAST lives in sast.yml, preview deploys in preprod-preview.yml — this file
# covers: typecheck, tests, production build, npm audit, secret scan, Dockerfile build.
# Keep jobs read-only: no secrets, no deploys, no writes except PR comments via GITHUB_TOKEN.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / test / build
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.1" # must match mise.toml [tools] node
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build (server + web)
        run: npm run build

  audit:
    name: npm audit (high+)
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production deps (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (betterleaks)
    runs-on: [self-hosted]
    steps:
      - name: Checkout (full history for leak scan)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Same scanner as the pre-commit hook (.githooks/pre-commit), so CI and
      # local enforce the same rules + .betterleaksignore. Version has a single
      # source of truth (mise.toml) — the step below reads it, so `mise up
      # betterleaks` needs no workflow edit. (gitleaks-action@v2 was removed:
      # it crashes artifact upload on self-hosted runners running as root.)
      - name: Install betterleaks
        run: |
          BETTERLEAKS_VERSION="$(sed -n 's/^betterleaks *= *"\([^"]*\)".*/\1/p' mise.toml)"
          [ -n "$BETTERLEAKS_VERSION" ] || { echo "::error::could not parse betterleaks version from mise.toml"; exit 1; }
          echo "betterleaks $BETTERLEAKS_VERSION (from mise.toml)"
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "/tmp/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/checksums.txt" -o /tmp/betterleaks-checksums.txt
          (cd /tmp && grep "betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" betterleaks-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -C /tmp betterleaks
          install -m 0755 /tmp/betterleaks "${HOME}/.local/bin/betterleaks" 2>/dev/null || install -m 0755 /tmp/betterleaks /usr/local/bin/betterleaks
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          betterleaks version

      - name: Betterleaks scan (full history)
        run: betterleaks git --redact -v --exit-code=2

  docker:
    name: Dockerfile builds
    runs-on: [self-hosted]
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build image (no push)
        run: docker build -t places:ci-${{ github.sha }} -f Dockerfile .
