name: SAST Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  semgrep-sast:
    name: Run Semgrep SAST
    runs-on: [self-hosted]

    container:
      image: semgrep/semgrep:latest # Runs Semgrep inside an isolated container natively on your runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Semgrep Scan
        run: semgrep ci --metrics=off
        env:
          SEMGREP_RULES: p/default
