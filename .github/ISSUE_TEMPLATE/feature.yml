name: Feature idea
description: Propose a feature. Discuss scope here — the agent drafts the spec only after you invoke it.
title: "[feat] "
labels: [enhancement, needs-discussion]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what hurts today?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done looks like
      description: How will we know this works? Observable behavior, not implementation.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Explicitly out of scope
      description: What should this feature NOT do? (Prevents scope creep during spec.)
  - type: input
    id: slug
    attributes:
      label: Suggested slug
      description: Short kebab-case name, e.g. tag-colors. Used for branch feat/<issue>-<slug> and openspec/changes/<slug>/.
