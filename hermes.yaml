# Hermes operations contract for the places app ("In my Belly").
# REFERENCE ONLY — Hermes's own scheduler is authoritative; this file is the
# reviewable contract between this repo and Hermes. Any rename of the commands,
# URLs, or health semantics below MUST update this file in the same change.
# See openspec/specs/ops-lifecycle/spec.md (change ops-preview-watch-rollback).
version: 1

docker_access:
  rule: auto-detect (no sudo when `docker info` works, sudo only when needed)
  override: DOCKER_SUDO="" (never sudo) or DOCKER_SUDO="sudo" (always sudo)
  applies_to:
    - .agents/skills/ops-preview/scripts/preprod-deploy.sh
    - .agents/skills/ops-preview/scripts/preprod-verify.sh
    - mise run preprod-up/down/logs
  verify_exit_codes: 0=green, 1=red, 2=check-errored-indeterminate-not-a-red

prod:
  url: https://places.patates.club
  health: https://places.patates.club/api/health
  api_base: https://places.patates.club/api/v1 # versioned JSON contract; legacy /api/* returns 404
  container: places
  internal_target: places:5173
  caddy: :8093
  volume: places-data
  deploy_method: arcane-gitops # Arcane polls main, pulls, builds, restarts. Agent NEVER builds/restarts prod.
  expected_version_source: main HEAD
  poll_every: 5m
  alert_after_consecutive_failures: 3
  version_stuck_grace_after_merge: 10m
  channel: discord#ops-places
  green_requires:
    - health_200_db_ok_at_declared_url
    - running_version_equals_main_head
    - oidc_discovery_ok
    - no_sustained_5xx_on_places_crud
    - otel_visible_for_running_version
  port_assertion: container_PORT_equals_caddy_target_no_host_publish

preprod:
  slot: single # B1: one preview slot, queued. Second branch without evict confirm is refused.
  trigger: # automated via .github/workflows/preprod-preview.yml on the self-hosted runner
    label: preview # PRs to main carrying this label get deployed; pushes without it build nothing
    reseed_policy: fresh-db on claim (label added or new branch), rebuild-keep-DB on synchronize
    teardown: PR close or label removal tears down only when that PR owns the slot
  url: https://places-staging.patates.club
  direct_url: http://localhost:5174
  health: https://places-staging.patates.club/api/health
  direct_health: http://localhost:5174/api/health
  api_base: https://places-staging.patates.club/api/v1
  container: places-staging
  internal_port: 5173
  host_port: 5174 # vite HMR keeps host 5173; preprod publishes 5174 so both bind together.
  caddy_target: places-staging:5173
  caddy: :8092
  volume: places-preprod-data
  project: places-preprod
  compose: docker compose --env-file .env.preprod -p places-preprod -f compose.yaml -f compose.preprod.yaml
  deploy_cmd: mise run preprod-deploy --branch <branch> --fresh-db
  evict_cmd: mise run preprod-deploy --branch <branch> --fresh-db --evict
  seed_cmd: npm run db:seed-demo
  verify_cmd: mise run preprod-verify
  green_requires:
    - container_up_over_30s
    - health_200_db_ok_at_declared_url
    - running_version_equals_branch_head
    - oidc_login_redirects_not_503
    - fixture_place_count_matches
    - boot_logs_have_no_invalid_config

watch:
  poll_command: curl -sS -m 10 <health_url>
  version_command: git rev-parse HEAD # expected; running version via health/version evidence or image label
  log_command: docker logs --tail 100 <container> # host-side; Hermes runs where docker is reachable
  alert_policy: one_alert_per_red_transition_plus_one_recovery_notice_no_repeat_while_red
  drill_prefix: "[DRILL]"

rollback:
  method: git-revert-on-main-only # git revert <sha> on main + push; Arcane redeploys. No direct prod rebuild.
  on_order_only: true
  migration_safety_rule: additive-only # reverted migrations must replay safely; destructive ops block automatic revert
  verify: prod_green_after_revert

backup:
  method: zerobyte-rest-to-pi # zerobyte UI job; provisioning covers volume+repo only (jobs are UI/API-only)
  volume_mount: places_places-data:/places-data:ro # external: true — zerobyte never writes prod data
  volume_id: places # backend: directory, path: /places-data
  repository: places-in-pi # backend: rest, url http://192.168.1.121:8000, path: places-data
  job: nightly ~04:00 Europe/Paris, source Places -> places-in-pi, 7 daily + 4 weekly
  covers: app.db + app.db-wal + app.db-shm as one snapshot set # crash-consistent; SQLite replays WAL on restore
  excludes: places-preprod-data # ephemeral, reseedable
  schedule_owner: zerobyte # zerobyte owns the schedule and its own failure notifications; no Hermes/cron polling
  fresh_check: on demand (before rollback, in RED report, or when asked) — newest snapshot younger than 26h

quota:
  project: mapstr-514323 # Places API (New): per-SKU monthly free caps, no $200 cushion
  binding_sku: place-details-enterprise # 2D9A-3DE0-3766: 1,000 free/mo, then $20/1k
  binding_cause: rating/userRatingCount + opening hours + priceLevel/priceRange + websiteUri + phone numbers in both Details masks (highest-SKU-wins; no Ent+Atmosphere fields)
  sweep_cost: ~778 calls per full sweep (78% of the Enterprise cap) — sweeps stay rare, never scheduled
  thresholds: 70% watch / 90% urgent of each SKU free cap, MTD (details+refresh share the Enterprise cap; textsearch tracked against Pro 5k with Enterprise-equivalent noted until tier confirmed)
  authoritative: cloud console billing reports grouped by SKU (tier confirmation)
  generated_by: hermes cron "Places quota check" (weekly, ops-observe skill, terminal tools) — silent GREEN, notice per WATCH/URGENT transition + recovery
  job_spec: run .agents/skills/ops-observe/scripts/quota-check.sh with GCP_SA_KEY_FILE=~/.secrets/gcp-billing-viewer.json in /home/yann/Documents/1001-restaurants (requires follow-up PR merged so the script is on main)
  key: service account places-billing-viewer (billing.viewer + monitoring.viewer), 0600 at ~/.secrets/gcp-billing-viewer.json
  textsearch: tracked but unattributed (no Text Search path in repo) — tier unconfirmed, verify in Billing Reports; consider per-consumer keys
  restore: stop places, restore snapshot into volume, PRAGMA integrity_check, start places, verify /api/health db:ok
  rehearsal: restore to empty temp volume + scratch container before trust, yearly after

runner:
  container: github-runner # self-hosted, same host as prod/preprod
  check: .agents/skills/ops-runner/scripts/runner-watch.sh # 0=green, 1=red, 2=check-errored-indeterminate-not-a-red
  watches:
    - container_alive
    - preview_queue_fresh_15m # every open `preview` PR has a preprod-preview run on its head
  alert_policy: one_alert_per_red_transition_plus_one_recovery_notice

patching:
  check: .agents/skills/ops-ship/scripts/patch-check.sh # 0=checked-ok, 1=attention (SAST failed on main or dependabot.yml missing), 2=check-errored-indeterminate-not-a-verdict
  inspects:
    - open Dependabot PRs (monthly npm + docker input, informational — never a red by itself)
    - latest SAST sast.yml run on main (failure blocks the monthly train)
  alert_policy: one_alert_per_red_transition_plus_one_recovery_notice

secrets_policy:
  may_read_for_validation:
    - .env.preprod
    - arcane_managed_prod_env
  validate_only:
    - presence
    - url_shape
    - secret_length
  never:
    - print
    - commit
    - forward
    - include_in_discord_or_logs
